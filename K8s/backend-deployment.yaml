apiVersion: apps/v1
kind: Deployment

metadata:
  name: cloudops-backend
  namespace: production-platform
  labels:
    app: cloudops-backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cloudops-backend

  template:
    metadata:
      labels:
        app: cloudops-backend

    spec:
      containers:
      - name: backend
        image: siaa28/cloudops-backend:v2
        imagePullPolicy: Always

        ports:
        - containerPort: 5000

        volumeMounts:
        - name: cloudops-storage
          mountPath: /app/data

        envFrom:
        - configMapRef:
            name: cloudops-config
        - secretRef:
            name: cloudops-secret

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"

        readinessProbe:
          httpGet:
            path: /health
            port: 5000

        livenessProbe:
          httpGet:
            path: /health
            port: 5000

      volumes:
      - name: cloudops-storage
        persistentVolumeClaim:
          claimName: cloudops-pvc